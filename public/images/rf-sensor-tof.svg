<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="rf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b0002" />
      <stop offset="50%" stop-color="#2a0206" />
      <stop offset="100%" stop-color="#160002" />
    </linearGradient>
    <linearGradient id="lime-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CDF73D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#CDF73D" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="rf-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#D71A06" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#rf-bg)" />
  <rect width="800" height="450" fill="url(#rf-grid)" />

  <!-- Formula Callout -->
  <g transform="translate(400, 65)">
    <rect x="-190" y="-30" width="380" height="56" rx="6" fill="#250104" stroke="#D71A06" stroke-width="1.5" />
    <text x="0" y="-3" fill="#CDF73D" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" text-anchor="middle">
      d = (c · t) / 2
    </text>
    <text x="0" y="16" fill="#e0b0b4" font-family="'Familjen Grotesk', sans-serif" font-size="11.5" text-anchor="middle">
      c ≈ 299,792,458 m/s · Δt ≈ 6.67 ns @ 1m Physical Distance
    </text>
  </g>

  <!-- Transceiver Node: LimeSDR -->
  <g transform="translate(130, 240)">
    <rect x="-85" y="-80" width="170" height="160" rx="8" fill="#200103" stroke="#CDF73D" stroke-width="2" />
    <rect x="-75" y="-70" width="150" height="32" rx="4" fill="#380508" stroke="#D71A06" stroke-width="1" />
    <text x="0" y="-48" fill="#CDF73D" font-family="'Fraunces', serif" font-size="14" font-weight="600" text-anchor="middle">LimeSDR Base</text>
    <text x="0" y="-18" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">SoapySDR API</text>
    <text x="0" y="2" fill="#e0b0b4" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Half-Duplex RF</text>
    <text x="0" y="24" fill="#D71A06" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">TX / RX Switching</text>
    <circle cx="0" cy="55" r="10" fill="#CDF73D" />
    <circle cx="0" cy="55" r="5" fill="#250104" />
  </g>

  <!-- RF Propagation Waves -->
  <g stroke="#CDF73D" stroke-width="2.5" fill="none" opacity="0.85">
    <!-- TX Pulse -->
    <path d="M 230 200 C 310 180, 410 180, 570 200" stroke-dasharray="8 6" />
    <path d="M 230 220 C 310 200, 410 200, 570 220" />
    <!-- RX Reflection -->
    <path d="M 570 260 C 410 280, 310 280, 230 260" stroke="#D71A06" stroke-dasharray="6 4" stroke-width="2" />
    <path d="M 570 280 C 410 300, 310 300, 230 280" stroke="#D71A06" stroke-width="2" />
  </g>

  <!-- Signal Labels -->
  <g font-family="'JetBrains Mono', monospace" font-size="10.5">
    <rect x="330" y="160" width="140" height="24" rx="4" fill="#250104" stroke="#CDF73D" stroke-width="1" />
    <text x="400" y="176" fill="#CDF73D" text-anchor="middle">TX Pulse (915 MHz)</text>

    <rect x="330" y="305" width="140" height="24" rx="4" fill="#250104" stroke="#D71A06" stroke-width="1" />
    <text x="400" y="321" fill="#ff7a70" text-anchor="middle">RX Return Echo</text>
  </g>

  <!-- Wearable Passive Antenna Target -->
  <g transform="translate(670, 240)">
    <rect x="-85" y="-80" width="170" height="160" rx="8" fill="#200103" stroke="#D71A06" stroke-width="2" />
    <rect x="-75" y="-70" width="150" height="32" rx="4" fill="#380508" stroke="#D71A06" stroke-width="1" />
    <text x="0" y="-48" fill="#ffffff" font-family="'Fraunces', serif" font-size="14" font-weight="600" text-anchor="middle">Wearable Target</text>
    <text x="0" y="-18" fill="#CDF73D" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Passive Strain Sensor</text>
    <text x="0" y="2" fill="#e0b0b4" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Saltwater Dielectric</text>
    <text x="0" y="24" fill="#ff7a70" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">Resonance Detuning</text>
    <circle cx="0" cy="55" r="10" fill="#D71A06" />
    <circle cx="0" cy="55" r="5" fill="#250104" />
  </g>

  <!-- Bottom Timeline & Findings -->
  <g transform="translate(400, 410)" font-family="'Familjen Grotesk', sans-serif" font-size="12">
    <rect x="-360" y="-22" width="720" height="36" rx="4" fill="#1b0103" stroke="#4a060b" />
    <text x="-340" y="1" fill="#CDF73D" font-weight="600">Hardware Post-Mortem:</text>
    <text x="-190" y="1" fill="#e0b0b4">PLL Settling Latency &gt; 6.67ns Round-Trip · Human Body Capacitance Detuning</text>
  </g>
</svg>
